schema: spec-driven

# Project context: guardrails for all OpenSpec artifacts of this repository.
# Origin: split from openspec/config.yaml of https://github.com/mytracks/gpsloader (change split-repositories,
# 2026-11-19). The planning history up to then is there under openspec/changes/archive/ (in German).
context: |
  ## Product
  GPSLoggerKit is a standalone Swift library with native implementations of file formats and logger
  protocols of GPS loggers. It builds a common data model from them and generates GPX 1.1. It is used by
  myTracks Loader (repository mytracks/gpsloader, GPL) and by myTracks Neo (App Store app without open
  source code) by package URL and version. Therefore every change MUST work for both users and must not
  contain app-specific assumptions.

  ## Language (decided by the developer on 2026-11-19)
  - All files in this repository are in English, including OpenSpec artifacts. The conversation with the
    developer is in German. Localized messages of the package exist in German and English.

  ## Platforms and technology (decided)
  - macOS 12+ and iOS/iPadOS 27+. Formats, parsers, protocol logic and GPX generation run on both
    platforms. Transports (serial/termios, IOHID, IOBluetooth) do not belong in this package; the app
    provides them through DeviceConnection.
  - Swift only: Swift 6 language mode, strict concurrency, async/await, Sendable, value types. No
    Objective-C, C or C++ source code. No third-party packages.
  - APIs newer than macOS 12 only with an `#available` fallback.
  - Output: GPX 1.1, times in UTC (ISO 8601 with Z), without extensions.
  - Everything testable without hardware: recorded device dialogs and synthetic files as fixtures,
    simulated devices for protocols. No real location data in specs and tests.
  - Versions according to Semantic Versioning, Git tags like `0.1.0`, starting with 0.1.0 (decided on
    2026-11-19). Below 1.0.0 a new minor version may contain incompatible changes; users depend on it
    with `.upToNextMinor`.

  ## License and clean-room (decided on 2026-11-03)
  - License: MIT. NO GPL code. Source code of gpsbabel, igotu2gpx, wsg2000.c, rgm3800, iTU4l and other
    GPL/CC-BY-SA projects must not be translated, copied or read as a template. This applies to all work
    in this repository.
  - Permitted sources: public specifications (for example NMEA sentence descriptions, Topografix XSD,
    Garmin FIT SDK, TCX XSD, FAI IGC specification, SkyTraq application notes, Locosys protocol
    specification), the developer's own myTracks code and black-box observation (sample files, output of
    the gpsbabel binary, recorded device dialogs). For every format or protocol the design names the
    sources used, and PROVENANCE.md has a section for it.
  - Ports from GPL sources never belong here but in GPSLoggerKitGPL (repository
    mytracks/GPSLoggerKitGPL), which depends on this package. This package never depends on it. Once GPL
    source code has been read for a family, it stays there.
  - The NAL description in gpsloader/docs/legacy-analysis.md comes from wsg2000.c and is therefore not a
    permitted source.

  ## Scope (families in this package)
  - File formats: NMEA 0183, GPX as input, Garmin FIT, TCX, Suunto Ambit SML/XML, IGC, KML/KMZ, CSV
    loggers Columbus V-900/Visiontac and iBlue CSV.
  - Device protocols: GNS 2000 / GNS 2000 plus (clean-room from the developer's own myTracks driver
    GpsDriver/GNS2000.m, decision of 2026-11-13).
  - Open: WSG-2000 NAL, decided as black-box in this package (without wsg2000.c).
    BG728 (Maptaq Trip IQ): assignment not decided yet (not yet confirmed).
  - New families: the proposal decides whether they are built clean-room here or as a port in
    GPSLoggerKitGPL and gets the developer's decision.

  ## Development conditions
  - The developer is very experienced with macOS and myTracks. Functional questions about devices are
    useful, explanations of basics are not.
  - The original myTracks code is in the neighboring checkout under ../gpsloader/input/mytracks4mac/
    (Git repository, read only, never change it, never take it over). Functional analysis:
    ../gpsloader/docs/legacy-analysis.md.
  - The user apps live in repositories of their own. A change here modifies only this package; the apps
    take over new versions with changes of their own.

rules:
  proposal:
    - Write in English.
    - Name the affected formats, devices and driver families explicitly.
    - Always include a section "Out of scope".
    - For a new family name the sources (specification, own code, black-box) and confirm that no
      GPL/CC-BY-SA source code is used.
    - State whether the change is compatible for users (patch, minor version).
  specs:
    - Write in English. Every requirement statement contains the keyword SHALL or MUST, because the
      OpenSpec validator requires it (for example "The package SHALL …").
    - Requirement texts at most 500 characters; examples and edge cases go into scenarios.
    - Scenarios in WHEN/THEN form, testable without hardware (fixtures, simulated devices).
  design:
    - Write in English.
    - For every format or protocol name the sources used (specification with reference, own myTracks
      code with path, black-box observation).
    - "Handle Swift 6 concurrency explicitly: isolation, Sendable, timeouts, cancellation."
  tasks:
    - Write in English.
    - Every parser/protocol task has a test task with fixtures.
    - Keep PROVENANCE.md and README up to date in the same change.
    - List manual hardware tests as separate, clearly marked tasks ("[manual, hardware]").
